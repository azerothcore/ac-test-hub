# Include inside your HTTPS static-site server block.
# For a /test-hub/ deployment, change the location to /test-hub/tc9-api/
# and set TC9_COOKIE_PATH=/test-hub/tc9-api/ for the browser-visible path.
# If an outer proxy strips a prefix, adjust only this inner location to match.
# The trailing slash on proxy_pass removes the location prefix before forwarding.
location ^~ /tc9-api/ {
    client_max_body_size 64k;
    proxy_pass http://127.0.0.1:8787/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 60s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
}
